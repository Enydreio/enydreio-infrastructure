services:
  app:
    image: ghcr.io/enydreio/enydreio:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DATABASE_DATA=host=${POSTGRES_HOST} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=Europe/Vienna
      - HOST_IP=${HOST_IP}
    volumes:
      - ./app-data:/root/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ./app --docker --init-options init-options.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    user: ${UID:-1000}:${GID:-1000}
    env_file:
      - path: .env
    ports:
      - 8085:8080
    command:
      - start-dev
volumes:
  postgres-data:

